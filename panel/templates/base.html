<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SO-101 panel{% endblock %}</title>
  <link rel="stylesheet" href="/static/panel.css?v={{ static_v }}">
</head>
<body>
<nav>
  <span class="brand">SO-101</span>
  <a href="/" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
  <a href="/page/train" class="{{ 'active' if active == 'train' }}">Train</a>
  <a href="/page/sim" class="{{ 'active' if active == 'sim' }}">Sim</a>
  <a href="/page/real" class="{{ 'active' if active == 'real' }}">Real arm</a>
  <a href="/camera" class="{{ 'active' if active == 'camera' }}">Camera</a>
  <a href="/page/sysid" class="{{ 'active' if active == 'sysid' }}">Sysid</a>
  <a href="/artifacts" class="{{ 'active' if active == 'artifacts' }}">Artifacts</a>
  <button id="reset-settings" class="nav-reset" title="Clear saved form values and restore original defaults">Reset defaults</button>
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/panel.js?v={{ static_v }}"></script>
</body>
</html>
