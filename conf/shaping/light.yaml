# @package _global_
# Intermediate careful-behavior shaping — the first refinement rung. Roughly the
# floor penalties the policy already trained under, plus table-sliding shaping.
# Curriculum: shaping=none (learn to grasp) -> light (relearn while staying gentle)
# -> full (deployment-target gentleness). Fine-tuning none -> full directly makes
# the policy stop touching the cube, so step through light.
lift_env:
  ee_cube_coeff: 0.0  # reaching is learned; proximity is not a refinement objective
  jaw_contact_reward: 0.0
  gripper_close_coeff: 0.0
  floor_contact_penalty: -0.12
  floor_proximity_thresh: 0.003
  floor_proximity_penalty: -0.05
  floor_force_coeff: -0.02
  poke_force_coeff: -0.0004
  cube_tip_coeff: -0.02
  cube_motion_coeff: -2.5  # table sliding per m/s beyond deadzone; grasped or not, airborne free
