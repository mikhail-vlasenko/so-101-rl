# @package _global_
# No careful-behavior shaping — curriculum stage 1. The policy learns to grasp
# and lift at all (floor hits / rough pokes are fine here); `shaping=full`
# refines gentleness afterward. Careful-behavior penalties are zeroed; the
# proximity threshold is unused while its penalty is zero.
lift_env:
  ee_cube_coeff: -0.5  # bootstrap reaching; retired once refinement starts
  jaw_contact_reward: 0.05  # pre-grasp acquisition bonuses, retired in light/full
  gripper_close_coeff: 0.05  # per unit closedness, only with opposing jaw contact
  floor_contact_penalty: 0.0
  floor_proximity_thresh: 0.003
  floor_proximity_penalty: 0.0
  floor_force_coeff: 0.0
  poke_force_coeff: 0.0
  cube_tip_coeff: 0.0
  cube_motion_coeff: 0.0
  # Marker visibility is no longer shaping: hidden/dropped tags are simply zeroed
  # in the obs (camera physics + the `dr` group's marker_dropout); no reward term.
