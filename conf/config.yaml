defaults:
  - _self_
  - env: pickplace
  - dr: full          # domain randomization preset: full (default) | light (lower cube/marker noise) | none (curriculum stage 1)
  - shaping: full     # lift careful-behavior shaping: full (default) | none (curriculum stage 1)

algorithm: ppo
# Checkpoint .zip to resume from. The composed config's hyperparameters (lr,
# gamma, batch_size, ppo.*/sac.*) are re-applied onto the loaded model — SB3's
# load() would otherwise silently restore the zip's values (see
# src/train.py:resume_overrides). Obs-dim settings (prev_actions_n,
# history_taps, marker_include_rot) and net_arch must still match the checkpoint.
resume: null
deterministic: true
seed: null
slow_factor: 2
render: true   # eval.py only: false for headless metric collection
stream_port: null  # eval/show_starts: serve sim view as MJPEG on this port (web panel)

# Per-step joint-space delta (rad) when |action|=1. Shared across all envs so
# the policy's notion of "one step" is uniform — env yamls reference this as
# ${action_scale}, and the twin reuses it as the manual-control target leash.
# All derived quantities (raw-unit conversion, per-tick real-bus clamp, joint
# speed limits) come from src/units.py — don't hand-compute them in comments.
action_scale: 0.07

# Feed sim ctrl through the Feetech firmware motion profile (src/servo_profile.py).
# true = write the profiled setpoint; false = write the raw tick target straight
# to data.ctrl (pre-55bd1ba behavior). ON by default: the baked so101.xml fit was
# refit *with* the profile (sysid.replay_sim always uses it), so the reduced
# damping/armature only match the real arm when the profile carries the lag —
# running with it off leaves the sim under-damped. Env yamls reference this as
# ${use_servo_profile}; sim-only — does not affect real rollouts (the bus always
# writes accel).
use_servo_profile: true

# obs_noise / obs_bias / cam_latency / marker_dropout are the domain-randomization
# knobs and live in the `dr` config group (conf/dr/{full,light,none}.yaml), selected
# via the defaults list above. They differ between curriculum stages; prev_actions_n /
# history_taps below do NOT (they change obs dim and must match across a resume).

# Easy-mode crutch for training from scratch: when true, every AprilTag pose is
# always fed fresh to the policy — neither the >70° camera-physics occlusion nor the
# `dr` group's stochastic marker_dropout hide it (a hidden tag otherwise keeps its
# last measured pose while its age channel grows). Leave false (the default) for any
# policy you'll deploy, where the real camera genuinely loses tags. Doesn't change obs
# dim, so it's safe to flip between resume stages (e.g. on for stage 1, off when refining).
marker_always_visible: false

# Simplified-starts crutch for training from scratch: when true, the cube always
# spawns standing upright on its smallest (hy*hz) face — the same easy-to-grasp
# pose every episode — instead of a random non-largest face + yaw. Leave false
# (the default) for any policy you'll deploy. Env yamls reference this as
# ${cube_smallest_face_only}. Doesn't change obs dim, so safe to flip between
# resume stages (e.g. on for stage 1, off when refining).
cube_smallest_face_only: false

# Number of past actions appended to the observation. 0 = disabled; N=2 lets the
# policy infer velocity / action smoothness from its own recent commands.
prev_actions_n: 1

# Whether each AprilTag marker's world rotation vector (axis-angle, 3 dims) is fed
# to the policy alongside its world xyz. Default false: marker positions alone are
# enough to localize the gripper, and the rotation estimate is the noisiest part of
# the real camera's pose recovery. Changes obs dim (markers go 2*6 -> 2*3), so it
# must match across a resume and between training and real rollout.
marker_include_rot: false

# Lag taps served as observation history (src/obs_history.py): the policy
# input carries the actor block at [t - tap] control ticks for each entry —
# geometric spacing per .claude/plans/obs_history_features.md, e.g.
# [0, 4, 16, 48] ≈ 0/0.27/1.07/3.2 s at 15 Hz — while the privileged tail
# stays a single copy. Must start at 0, strictly ascending. [0] = no history.
# Changes obs dim: it must match the checkpoint across resume/eval/real
# rollout; migrate a checkpoint onto new taps with src/distill.py
# (distill.teacher_obs=current) followed by the mandatory PPO fine-tune.
history_taps: [0]

train:
  time_limit_minutes: 20
  n_envs: 16
  # Policy input is normalized by a fixed physically-derived affine
  # (src/obs_norm.py) baked into the network — not configurable, and changing
  # its constants invalidates checkpoints like an obs-dim change would.
  net_arch: [256, 256, 256, 256]
  total_timesteps: 40_000_000
  learning_rate: 3e-4
  lr_schedule: constant
  lr_min: 3e-4
  batch_size: 4096
  gamma: 0.99
  log_interval: 1
  checkpoint_freq: 1_000_000
  eval_freq: 1_000_000
  n_eval_episodes: 32

sac:
  buffer_size: 100_000
  learning_starts: 100_000
  train_freq: 1
  gradient_steps: 1
  tau: 0.005

ppo:
  n_steps: 2048
  n_epochs: 5
  clip_range: 0.2
  ent_coef: 0.001
  gae_lambda: 0.95
  vf_coef: 1.0

wandb:
  project: robot-arm
  entity: mvlasenko
  enabled: true

# DAgger distillation (src/distill.py): migrate a trained teacher checkpoint
# onto a fresh student with a new architecture or observation layout without a
# curriculum restart. The student is regressed onto the teacher's deterministic
# action + value on states the (annealed teacher->student) rollout visits under
# the student's deployment DR. Output is a resume-compatible checkpoint — always
# follow distillation with a short PPO fine-tune via resume=. Only consulted by
# src.distill; inert for src.train / src.eval.
distill:
  teacher: null          # REQUIRED: path to the trained teacher checkpoint .zip
  # Which observation the teacher is queried on at each visited state:
  #   identical  — teacher sees the student's own obs (architecture-only change,
  #                e.g. wider net). Teacher and student obs spaces must match.
  #   current    — teacher sees the single-frame [actor block | priv tail]
  #                sliced out of the student's lag-tapped obs (tap 0 + tail) —
  #                its own trained layout. The warm start for a history_taps
  #                migration; the teacher must be a single-frame checkpoint.
  #   privileged — teacher sees the always-fresh-tag privileged view
  #                (SO101BaseEnv.privileged_obs), i.e. what a
  #                marker_always_visible=true policy sees, while the student
  #                trains on the camera obs with dropout/hold-last-pose. The
  #                teacher must be a single-frame checkpoint.
  teacher_obs: identical
  net_arch: null         # student hidden widths; null = reuse cfg.train.net_arch
  iterations: 10         # DAgger rounds (collect -> aggregate -> regress)
  steps_per_iter: 50_000 # env steps collected per round, across all envs
  epochs: 4              # SGD passes over the aggregated dataset per round
  batch_size: 4096
  lr: 3.0e-4
  vf_coef: 1.0           # weight on the value-distillation MSE (fresh critic trap)
  beta_start: 1.0        # teacher's share of control at round 0 (pure teacher)
  beta_end: 0.0          # teacher's share of control at the last round (pure student)
  buffer_cap: 1_000_000  # max aggregated transitions retained (DAgger dataset, FIFO)
  eval_episodes: 32      # paired teacher/student eval episodes (bug tripwire)
  out: distilled.zip     # student checkpoint path (relative to repo root)
