defaults:
  - _self_
  - env: pickplace
  - dr: full          # domain randomization preset: full (default) | light (lower cube/marker noise) | none (curriculum stage 1)
  - shaping: full     # lift careful-behavior shaping: full (default) | none (curriculum stage 1)

algorithm: ppo
resume: null
deterministic: true
seed: null
slow_factor: 2
render: true   # eval.py only: false for headless metric collection
stream_port: null  # eval/show_starts: serve sim view as MJPEG on this port (web panel)

# Per-step joint-space delta (rad) when |action|=1. Shared across all envs so
# the policy's notion of "one step" is uniform — env yamls reference this as
# ${action_scale}, and the twin reuses it as the manual-control target leash.
# All derived quantities (raw-unit conversion, per-tick real-bus clamp, joint
# speed limits) come from src/units.py — don't hand-compute them in comments.
action_scale: 0.07

# Feed sim ctrl through the Feetech firmware motion profile (src/servo_profile.py).
# true = write the profiled setpoint; false = write the raw tick target straight
# to data.ctrl (pre-55bd1ba behavior). Currently OFF: with the profile on, lift
# became unlearnable and old checkpoints stopped transferring — under
# investigation (the refit kp/armature give only ~20% per-tick authority; see
# tests/test_profile_stall.py). Env yamls reference this as ${use_servo_profile};
# sim-only — does not affect real rollouts (the bus always writes accel).
use_servo_profile: false

# obs_noise / obs_bias / obs_latency are the domain-randomization knobs and live in
# the `dr` config group (conf/dr/{full,none}.yaml), selected via the defaults list
# above. They differ between curriculum stages; prev_actions_n / frame_stack below
# do NOT (they change obs dim and must match across a resume).

# Easy-mode crutch for training from scratch: when true, every AprilTag pose is
# always fed to the policy — neither the >70° camera-physics occlusion nor the `dr`
# group's stochastic marker_dropout zero it. Leave false (the default) for any policy
# you'll deploy, where the real camera genuinely loses tags. Doesn't change obs dim,
# so it's safe to flip between resume stages (e.g. on for stage 1, off when refining).
marker_always_visible: false

# Simplified-starts crutch for training from scratch: when true, the cube always
# spawns standing upright on its smallest (hy*hz) face — the same easy-to-grasp
# pose every episode — instead of a random non-largest face + yaw. Leave false
# (the default) for any policy you'll deploy. Env yamls reference this as
# ${cube_smallest_face_only}. Doesn't change obs dim, so safe to flip between
# resume stages (e.g. on for stage 1, off when refining).
cube_smallest_face_only: false

# Number of past actions appended to the observation. 0 = disabled; N=2 lets the
# policy infer velocity / action smoothness from its own recent commands.
prev_actions_n: 1

# Whether each AprilTag marker's world rotation vector (axis-angle, 3 dims) is fed
# to the policy alongside its world xyz. Default false: marker positions alone are
# enough to localize the gripper, and the rotation estimate is the noisiest part of
# the real camera's pose recovery. Changes obs dim (markers go 2*6 -> 2*3), so it
# must match across a resume and between training and real rollout.
marker_include_rot: false

# Number of consecutive observations stacked into the policy input.
# 1 = no stacking (raw OBS_DIM). N>1 multiplies obs_dim by N via SB3's VecFrameStack.
frame_stack: 1

train:
  time_limit_minutes: 20
  n_envs: 16
  net_arch: [256, 256, 256, 256]
  input_batchnorm: true
  total_timesteps: 40_000_000
  learning_rate: 3e-4
  lr_schedule: constant
  lr_min: 3e-4
  batch_size: 4096
  gamma: 0.95
  log_interval: 1
  checkpoint_freq: 1_000_000
  eval_freq: 1_000_000
  n_eval_episodes: 32

sac:
  buffer_size: 100_000
  learning_starts: 100_000
  train_freq: 1
  gradient_steps: 1
  tau: 0.005

ppo:
  n_steps: 2048
  n_epochs: 5
  clip_range: 0.2
  ent_coef: 0.001
  gae_lambda: 0.95
  vf_coef: 1.0

wandb:
  project: robot-arm
  entity: mvlasenko
  enabled: true
