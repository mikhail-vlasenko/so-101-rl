defaults:
  - _self_
  - env: pickplace

algorithm: ppo
resume: null
deterministic: true
seed: null
slow_factor: 2
render: true   # eval.py only: false for headless metric collection
stream_port: null  # eval/show_starts: serve sim view as MJPEG on this port (web panel)

# Per-step joint-space delta (rad) when |action|=1. Shared across all envs so
# the policy's notion of "one step" is uniform — env yamls reference this as
# ${action_scale}, and the twin reuses it as the manual-control target leash.
# All derived quantities (raw-unit conversion, per-tick real-bus clamp, joint
# speed limits) come from src/units.py — don't hand-compute them in comments.
action_scale: 0.07

# Per-step Gaussian noise added to observations during training (sim2real domain randomization).
# Noise is applied at the source (qpos, qvel, marker poses, cube_pos); derived obs
# (cube_to_target) inherit the noise via the noisy cube_pos. Reward always uses true state.
obs_noise:
  qpos_sigma: 0.005        # rad,   joint encoder jitter (~0.3°)
  qvel_sigma: 0.05         # rad/s, joint velocity noise (numerically differentiated)
  marker_pos_sigma: 0.002  # m,     per-frame AprilTag position jitter (solvePnP)
  marker_rot_sigma: 0.02   # rad,   per-frame AprilTag orientation jitter (~1°)
  cube_sigma: 0.003        # m,     cube position from vision pipeline

# Per-episode constant bias added to observations (calibration drift / mounting offset).
# Sampled once on reset, held constant for the whole episode. No qvel bias — velocity from
# differentiating biased qpos has zero DC offset, so a velocity bias is non-physical.
# Marker biases are drawn independently per tag (glue placement + camera extrinsics error
# don't correlate between the two tags). qpos/cube bias stay disabled: see
# calibration_plan.md — those are calibrated on the real rig and subtracted pre-policy.
obs_bias:
  qpos_sigma: 0.0
  marker_pos_sigma: 0.005  # m,    tag glue placement + extrinsics offset
  marker_rot_sigma: 0.05   # rad,  tag alignment error (~3°)
  cube_sigma: 0.0

# Number of frames the agent's observation lags behind the true state (sim2real DR).
# 0 = no delay; N = agent sees the obs from N steps ago. Reward path uses true state.
# At 15 Hz control, 2 frames = 133 ms, more lag than the real bus exhibits — 1 frame fits.
obs_latency: 1

# Number of past actions appended to the observation. 0 = disabled; N=2 lets the
# policy infer velocity / action smoothness from its own recent commands.
prev_actions_n: 1

# Number of consecutive observations stacked into the policy input.
# 1 = no stacking (raw OBS_DIM). N>1 multiplies obs_dim by N via SB3's VecFrameStack.
frame_stack: 1

train:
  time_limit_minutes: 40
  n_envs: 16
  net_arch: [256, 256, 256, 256]
  input_batchnorm: true
  total_timesteps: 40_000_000
  learning_rate: 3e-4
  lr_schedule: constant
  lr_min: 3e-4
  batch_size: 4096
  gamma: 0.95
  log_interval: 1
  checkpoint_freq: 1_000_000
  eval_freq: 1_000_000
  n_eval_episodes: 32

sac:
  buffer_size: 100_000
  learning_starts: 100_000
  train_freq: 1
  gradient_steps: 1
  tau: 0.005

ppo:
  n_steps: 2048
  n_epochs: 5
  clip_range: 0.2
  ent_coef: 0.001
  gae_lambda: 0.95
  vf_coef: 1.0

wandb:
  project: robot-arm
  entity: mvlasenko
  enabled: true
