# @package _global_
env_name: pickplace

pickplace_env:
  action_scale: ${action_scale}   # shared across envs, defined in config.yaml
  use_servo_profile: ${use_servo_profile}   # defined in config.yaml
  max_steps: 450          # 450 steps / 30 Hz = 15 s episode
  n_substeps: 10          # 10 * (1/300 s timestep in so101.xml) = exactly 30 Hz
  cube_low: [0.15, -0.15]    # xy only; spawn z + orientation come from sample_cube_orientation
  cube_high: [0.30, 0.15]
  place_target: [0.18, 0.0, 0.02]
  # place_target_radius and place_target_height must match the place_target site in scene_pickplace.xml
  place_target_radius: 0.04
  place_target_height: 0.02
  ring_center: [0.18, 0.0]
  ring_exclusion_radius: 0.075
  passive_pose: [0.0, -1.0, 0.7, 0.9, 0.0, 0.0]
  floor_contact_penalty: -0.02
  ring_contact_penalty: -0.05
  ring_height_min: 0.0
  ring_height_max: 0.05
