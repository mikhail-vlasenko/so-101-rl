# @package _global_
env_name: lift

lift_env:
  action_scale: ${action_scale}   # shared across envs, defined in config.yaml
  max_steps: 300          # 300 steps / 15 Hz = 20 s episode
  n_substeps: 10          # 10 * (1/150 s timestep in so101.xml) = exactly 15 Hz
  cube_low: [0.15, -0.15]    # xy only; spawn z + orientation come from sample_cube_orientation
  cube_high: [0.30, 0.15]
  target_height: 0.10
  # floor_contact_penalty / floor_proximity_* / poke_force_coeff / cube_tip_coeff /
  # marker_hidden_penalty are careful-behavior shaping, owned by the `shaping`
  # config group (conf/shaping/{full,light,none}.yaml) so they can be toggled
  # off for stage 1.
