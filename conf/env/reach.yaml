# @package _global_
env_name: reach

reach_env:
  action_scale: 0.02      # rad per joint per step — small for slow, gradual motion
  max_steps: 400
  n_substeps: 10

  # Safety: episode penalizes any step where the EE site z is below this height.
  # Waypoints are validated against this on env init and reach training rejects
  # initial poses below it.
  ee_z_min: 0.10

  # Joint-space distance threshold (rad) for "arm at target".
  tolerance: 0.05
  # Steps the policy must remain within tolerance before terminating successfully.
  dwell_steps: 10

  # Joint-limit penalty: any joint whose normalized distance from the joint's
  # range center exceeds `limit_margin` incurs a quadratic penalty. Waypoints
  # are also required to satisfy this bound (validated on init).
  limit_margin: 0.85

  # Set of 4 fixed joint-space target poses, one of which is selected per episode
  # and indicated to the policy via a one-hot in the observation.
  # Order matches JOINT_NAMES: shoulder_pan, shoulder_lift, elbow_flex,
  # wrist_flex, wrist_roll, gripper.
  waypoints:
    # EE z values verified via scripts/probe_waypoints.py — all >= 0.23m.
    - [ 0.0, -1.4,  1.2,  0.0, 0.0, 0.5]   # centered, gripper open
    - [ 0.7, -1.4,  1.2,  0.0, 0.0, 0.5]   # panned right
    - [-0.7, -1.4,  1.2,  0.0, 0.0, 0.5]   # panned left
    - [ 0.0, -1.4,  1.0, -0.3, 0.0, 0.1]   # different posture, gripper closed-ish

  # Reward shaping
  progress_coeff: 5.0              # reward per rad of joint-distance reduction
  action_penalty_coeff: 0.01       # discourages large actions (smoothness)
  in_target_bonus: 0.1             # per-step bonus while within tolerance
  dwell_complete_bonus: 10.0       # one-shot bonus at successful termination
  ee_below_penalty: -1.0           # per-step penalty if EE z < ee_z_min
  joint_limit_penalty_coeff: 5.0   # quadratic penalty per joint past limit_margin
  time_penalty: -0.01
