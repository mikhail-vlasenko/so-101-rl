# @package _global_
# Light domain randomization — an intermediate curriculum stage between `dr=none`
# (clean stage 1) and `dr=full` (the sim2real deployment target). Vision is the
# noisiest part of the real pipeline, so this profile keeps the joint-encoder
# noise at the full level but lowers the cube and marker (AprilTag) noise and
# biases, easing the policy into perception error before the full DR refine.
# Only the DR knobs differ from full; prev_actions_n / history_taps live in
# config.yaml and MUST stay identical across stages (they change obs dim).

# Anisotropic marker/cube position noise (src/marker_noise.py): same shape as dr=full,
# lower magnitude on the arm markers (tag_px_noise scaled down; depth_factor kept, it is
# a geometry ratio). The cube tag keeps the full-level px error (~4 mm vec RMS at its mean
# distance) — the curriculum eases the arm's self-perception, not the manipulated object.
obs_noise:
  qpos_sigma: 0.005
  marker_rot_sigma: 0.01
  tag_px_noise: 0.1
  cube_px_noise: 0.2
  tag_depth_factor: 2.0

obs_bias:
  qpos_sigma: 0.01
  marker_pos_sigma: 0.002
  marker_rot_sigma: 0.02
  cube_sigma: 0.002
  marker_common_sigma: 0.0015

# Same as dr=full: latency is measured hardware timing, not a difficulty knob.
cam_latency:
  frame_ms: 33.3
  delay_ms: [42.0, 52.0]
  jitter_ms: 1.5

marker_dropout:
  near: 0.02
  far: 0.01

# Sponge resize: physical DR (not vision). Meters.
cube_size_jitter: 0.005
