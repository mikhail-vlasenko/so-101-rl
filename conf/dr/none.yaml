# @package _global_
# No domain randomization — curriculum stage 1. Train the lift skill clean from
# scratch (fast, reliable convergence), then fine-tune under `dr=full` (stage 2).
# Only the DR knobs are zeroed here; prev_actions_n / frame_stack live in
# config.yaml and MUST stay identical across stages or the checkpoint won't load
# (they change the observation dimension; noise/bias/latency do not).

obs_noise:
  qpos_sigma: 0.0
  qvel_sigma: 0.0
  marker_pos_sigma: 0.0
  marker_rot_sigma: 0.0
  cube_sigma: 0.0

obs_bias:
  qpos_sigma: 0.0
  marker_pos_sigma: 0.0
  marker_rot_sigma: 0.0
  cube_sigma: 0.0

obs_latency: 0

# No stochastic detector dropout (tags past 70° are still zeroed — camera physics).
marker_dropout:
  near: 0.0
  far: 0.0
