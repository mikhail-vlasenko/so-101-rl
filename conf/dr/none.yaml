# @package _global_
# No domain randomization — curriculum stage 1. Train the lift skill clean from
# scratch (fast, reliable convergence), then fine-tune under `dr=full` (stage 2).
# Only the DR knobs are zeroed here; prev_actions_n / history_taps live in
# config.yaml and MUST stay identical across stages or the checkpoint won't load
# (they change the observation dimension; noise/bias/latency do not).

obs_noise:
  qpos_sigma: 0.0
  marker_rot_sigma: 0.0
  tag_px_noise: 0.0        # zero px error -> zero anisotropic marker noise
  tag_depth_factor: 2.0    # unused at px_noise=0; kept so the key set matches dr=full/light
  live_sigma: 0.0
  precise_sigma: 0.0
  sqrtm_rot_sigma: 0.0

obs_bias:
  qpos_sigma: 0.0
  marker_pos_sigma: 0.0
  marker_rot_sigma: 0.0
  live_sigma: 0.0
  precise_sigma: 0.0
  precise_rot_sigma: 0.0
  marker_common_sigma: 0.0

# Synchronous zero-latency camera: marker/cube obs are the current state.
# (qvel is still the backward difference of qpos over the tick — that's the
# observation pipeline, not a DR knob.)
cam_latency: null

# No stochastic detector dropout (tags past 70° still go stale — camera physics).
marker_dropout:
  near: 0.0
  far: 0.0

# No sponge resize: the nominal 6x4x2.5 cm box every episode.
cube_size_jitter: 0.0
