# @package _global_
# Full domain randomization — the sim2real target for deployment-ready policies.
# This is the default; curriculum stage 1 trains clean via `dr=none`, then
# stage 2 fine-tunes the resulting checkpoint back under `dr=full`.

# Per-sample Gaussian noise added to observations during training (sim2real domain
# randomization): qpos per step (encoder read), markers/cube channels per camera frame,
# frozen into the frame at capture. Derived obs (cube_to_target) inherit the noise via
# the noisy live centroid. Reward always uses true state. No qvel_sigma: the qvel obs is
# the backward difference of consecutive noisy qpos over the control tick — exactly the
# real pipeline (ArmLoop.tick) — so its noise is sqrt(2)*qpos_sigma/control_dt
# (~0.11 rad/s), inherited rather than configured.
obs_noise:
  qpos_sigma: 0.005        # rad,   joint encoder jitter (~0.3°)
  marker_rot_sigma: 0.02   # rad,   per-frame AprilTag orientation jitter (~1°)
  # Marker position noise is anisotropic in the camera frame (src/marker_noise.py):
  # small in the image plane, large along each tag's own camera ray (solvePnP range from
  # apparent size). lateral = (Z/f)*tag_px_noise, depth = (Z**2/(f*W))*tag_px_noise*tag_depth_factor,
  # with f (~968 px) from camera_intrinsics.yaml and W (0.02 m) the printed tag edge.
  # At the scene's mean tag distance Z~0.44 m: ~0.09 mm lateral, ~4 mm depth. px_noise
  # sits at the calibrated reproj residual (0.21 px) un-inflated: per-frame i.i.d.
  # redraws overstate the temporal churn of the real error (mostly pose-locked — see
  # TODO.md), so the honest deploy-conditions inflation waits for the pose-locked/
  # temporal split.
  tag_px_noise: 0.2        # px,    effective solvePnP corner error, arm marker tags
  tag_depth_factor: 2.0    #        depth-error amplification over the image-plane baseline
  # Tag-free cube positions are isotropic: stereo triangulation has no solvePnP
  # depth pathology. Dense-surface noise/dropout is configured separately below.
  live_sigma: 0.003        # m,    per-frame triangulated visible-centroid jitter
  precise_sigma: 0.003     # m,    per-refresh dense-cloud center error

# Per-episode constant bias added to observations (calibration drift / mounting offset).
# Sampled once on reset, held constant for the whole episode. No qvel bias — velocity from
# differentiating biased qpos has zero DC offset, so a velocity bias is non-physical.
# marker_pos_sigma is per-tag independent (each tag's own glue placement / pose-estimate
# error); live/precise are the cube channels' own systematic offsets; marker_common_sigma
# is a separate shift shared by ALL camera-derived positions — the real pipeline
# re-anchors the cameras from the two-tag table board and EMAs accepted pair solves,
# so that anchor's calibration offset settles into a common-mode shift on finger, wrist,
# and both cube channels alike. qpos biases are the small residual left after the real
# rig subtracts the bulk calibration offset pre-policy — see calibration_plan.md.
obs_bias:
  qpos_sigma: 0.01
  marker_pos_sigma: 0.002    # m,    per-tag glue placement / pose-estimate error
  marker_rot_sigma: 0.02     # rad,  tag alignment error (~3°)
  live_sigma: 0.00401        # m,    systematic visible-surface/segmentation offset. Only
                             #       the *spread* of the per-window offset across sponge
                             #       poses; its common part (measured [-2.2, 6.0, 0.1] mm,
                             #       toward the cameras) is geometry the sim already
                             #       reproduces by sampling the visible surface, so
                             #       randomizing it here too would double-count it
  precise_sigma: 0.003       # m,    systematic dense-cloud center offset
  marker_common_sigma: 0.0015 # m,   shared shift on all tags (table calib; ~extrinsics.yaml spread_mm 2.28)

# Synthetic dense-stereo degradation, applied only on scheduled captures.
synthetic_cloud:
  point_noise_sigma_m: 0.003
  point_dropout_probability: 0.25
  whole_view_loss_probability: 0.05

# Observation latency (sim2real): only camera-derived obs lag.
# Encoder reads are ~2 ms on the bus — effectively fresh at a 66.7 ms tick — so
# qpos carries no latency, and qvel's half-tick lag comes from differencing.
# One simulated capture feeds three availability streams: arm AprilTags, the
# dual-SAM live centroid, and dense BPS. Each delay is sampled once per episode;
# the frame schedule adds capture/control phase staleness on top.
cam_latency:
  frame_ms: 33.3           # C922 @ 30 fps (probe run: 30.0 fps, p95 gap 36 ms)
  # rollout_lift_1786825926.csv completed 252 live+dense object updates in
  # 14.0 s (18.0 Hz). The 27.3 ms mean dense worker time was below the tracked
  # pair interval, so ObjectSource's producer cadence was the sustained bound;
  # transient backlog still keeps only the newest pair.
  object_frame_ms: 55.6
  # Measured by sysid/probe_cam_latency.py (run probe_1783181402, driven
  # wrist_flex sine, residual 0.9 mm): capture -> cap.read() tau = 39.5 ms,
  # + ~7 ms AprilTag detect = ~46.5 ms capture -> pose available. Range covers
  # per-frame detect variance plus headroom for run-to-run drift.
  marker_delay_ms: [42.0, 52.0]
  # Three dual-camera rollouts on 2026-08-15 measured policy-facing live ages
  # of 139-146 ms mean / 160-173 ms p95. Approximate mean stack for the clean
  # run (145.6 ms total): 39.5 ms capture -> read/decode (measured), 36.0 ms
  # for both SAM2 passes (measured), ~20 ms for both table-anchor detections
  # (inferred from ~10 ms/view marker telemetry), ~10-20 ms uninstrumented
  # mask/centroid/anchor work, and ~33 ms average pickup by the 15 Hz policy.
  # Pairing is normally near-zero because the worker takes each feed's newest
  # frame and skips backlog. This range folds the uninstrumented worker/cadence
  # effects into capture -> live availability; CameraSim then adds its own
  # frame/control phase, matching the end-to-end age rather than claiming an
  # exact per-stage model.
  # The separate 18 Hz object phase contributes more age than the raw 30 Hz
  # camera phase. This range composes into the three measured rollout runs'
  # 139-146 ms mean / 160-173 ms p95 live-age envelope.
  live_delay_ms: [107.0, 117.0]
  # On the clean continuously-refreshed run, dense BPS age was 174.1 ms mean /
  # 204.6 ms p95. StereoSGBM/BPS added 27.3 ms mean / 31.2 ms p95 to the
  # live-centroid path; the remaining mean publication overhead was ~1 ms.
  # The separate 18 Hz object phase contributes more age than the 30 Hz camera
  # phase. This reduced processing range keeps the composed simulated age at
  # the measured 174.1 ms mean / 204.6 ms p95.
  bps_delay_ms: [140.0, 155.0]
  jitter_ms: 1.5

# AprilTag detector dropout: per-frame probability a geometrically-visible tag is
# missed, so its obs freezes at the last detected pose while its age channel grows
# (same convention as a tag turned away). `near` applies in the grazing 65-70°
# boundary band (flakier detection), `far` to tags comfortably facing the camera.
# Tags past 70° are always missed (camera physics, not this knob). The live cube
# channel reuses the same knob for the segmentation tracker's per-frame misses:
# `near` when the object is only partially visible in some view, `far` when
# comfortably visible in both (either camera losing it entirely is a certain
# miss — geometry, not this knob). Losing the pose is its own cost — there is
# no reward term.
marker_dropout:
  near: 0.02
  far: 0.01

# Per-episode sponge resize (physical DR, not vision): each of the box's three
# full side lengths is jittered by an independent uniform +/- cube_size_jitter
# (resampled every reset), so the policy sees a range of sponge sizes — and,
# through the BPS distances, must actually read the episode's shape. The
# nominal 6x4x2.5 cm box is the center; draws that would break the strict
# long>mid>short face ordering (required by sample_cube_orientation) are
# reject-sampled. Applies to every cube env (lift + pickplace) since it's the
# same physical sponge. Meters.
cube_size_jitter: 0.01
